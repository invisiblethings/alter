<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <!-- Halloween scene for the GBP / Facebook post (layout: haunted). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0418"/>
      <stop offset=".45" stop-color="#2a0d47"/>
      <stop offset=".72" stop-color="#6a1f52"/>
      <stop offset=".9" stop-color="#c4521c"/>
    </linearGradient>
    <radialGradient id="moon" cx="42%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fffbe6"/>
      <stop offset=".7" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f7b955"/>
    </radialGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="winGlow">
      <stop offset="0" stop-color="#ffb02e" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ff7a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#ff8a1a"/>
    </linearGradient>
    <radialGradient id="pump" cx="45%" cy="40%">
      <stop offset="0" stop-color="#ffa63d"/>
      <stop offset="1" stop-color="#d9520b"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
    <g id="bat"><path d="M0 0c8-10 18-12 26-6 4-8 12-10 16-4 4-6 12-4 16 4 8-6 18-4 26 6-10-2-18 2-22 10-6-6-12-6-16 2-4-8-10-8-16-2-4-8-12-12-30-10z"/></g>
  </defs>

  <rect width="1200" height="900" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff" opacity=".8">
    <circle cx="640" cy="60" r="1.6"/><circle cx="700" cy="140" r="1.2"/><circle cx="980" cy="70" r="1.8"/><circle cx="1110" cy="150" r="1.3"/>
    <circle cx="560" cy="200" r="1.1"/><circle cx="1050" cy="250" r="1.2"/><circle cx="760" cy="40" r="1.4"/><circle cx="1160" cy="40" r="1.6"/>
    <circle cx="420" cy="90" r="1.2"/><circle cx="300" cy="40" r="1.4"/><circle cx="160" cy="130" r="1.1"/><circle cx="60" cy="60" r="1.5"/>
  </g>

  <!-- moon -->
  <circle cx="880" cy="250" r="230" fill="url(#moonGlow)"/>
  <circle cx="880" cy="250" r="135" fill="url(#moon)"/>
  <g fill="#e9b85c" opacity=".35"><circle cx="840" cy="215" r="20"/><circle cx="920" cy="290" r="14"/><circle cx="900" cy="200" r="9"/></g>

  <g transform="translate(0 -64)">
  <!-- distant hill -->
  <path d="M0 800 C200 770 380 770 500 760 C620 690 760 670 900 690 C1010 705 1100 690 1200 660 L1200 900 L0 900 Z" fill="#1a0a2b"/>

  <!-- bare tree (right) -->
  <g fill="none" stroke="#0a0412" stroke-linecap="round">
    <path d="M1135 900 C1130 800 1145 720 1120 640 C1105 590 1120 540 1100 480" stroke-width="26"/>
    <path d="M1120 640 C1160 600 1180 560 1200 540" stroke-width="12"/>
    <path d="M1108 560 C1070 520 1040 500 1000 470" stroke-width="10"/>
    <path d="M1040 505 C1030 470 1035 440 1020 410" stroke-width="6"/>
    <path d="M1100 480 C1080 440 1090 400 1070 360" stroke-width="8"/>
    <path d="M1085 420 C1050 400 1020 380 990 375" stroke-width="5"/>
    <path d="M1102 500 C1140 470 1160 440 1170 400" stroke-width="7"/>
    <path d="M1000 470 C985 455 975 440 960 438" stroke-width="4"/>
  </g>

  <!-- haunted house -->
  <g fill="#0b0514">
    <!-- tower -->
    <rect x="655" y="380" width="92" height="380"/>
    <path d="M640 388 L701 230 L762 388 Z"/>
    <rect x="698" y="205" width="6" height="30"/>
    <!-- main body, leaning slightly -->
    <path d="M735 470 L1010 462 L1016 760 L735 760 Z"/>
    <!-- crooked main roof -->
    <path d="M718 478 L860 318 L1030 470 Z"/>
    <!-- dormer -->
    <path d="M832 420 L868 372 L904 420 Z"/>
    <rect x="840" y="418" width="56" height="40"/>
    <!-- chimney, tilted -->
    <path d="M950 330 L978 334 L972 420 L946 416 Z"/>
    <!-- porch -->
    <path d="M770 640 L990 640 L1006 664 L756 664 Z"/>
    <rect x="782" y="664" width="8" height="96"/><rect x="972" y="664" width="8" height="96"/>
    <!-- porch steps -->
    <rect x="845" y="742" width="86" height="18"/>
  </g>
  <!-- broken roof shingles -->
  <g stroke="#2b1640" stroke-width="3"><path d="M780 430 L800 412"/><path d="M955 440 L975 456"/><path d="M688 300 L705 290"/></g>

  <!-- window glows -->
  <g filter="url(#blur)" opacity=".9">
    <circle cx="701" cy="430" r="45" fill="url(#winGlow)"/>
    <circle cx="868" cy="440" r="40" fill="url(#winGlow)"/>
    <circle cx="800" cy="560" r="55" fill="url(#winGlow)"/>
    <circle cx="950" cy="560" r="55" fill="url(#winGlow)"/>
    <circle cx="888" cy="700" r="40" fill="url(#winGlow)"/>
  </g>
  <!-- windows -->
  <g fill="url(#win)">
    <path d="M686 450 L686 418 Q701 398 716 418 L716 450 Z"/>
    <rect x="686" y="520" width="30" height="44"/>
    <circle cx="868" cy="438" r="15"/>
    <rect x="776" y="528" width="48" height="66"/>
    <rect x="926" y="528" width="48" height="66"/>
    <rect x="870" y="676" width="36" height="66"/>
  </g>
  <!-- window frames and a broken shutter -->
  <g fill="#0b0514">
    <rect x="798" y="528" width="4" height="66"/><rect x="776" y="558" width="48" height="4"/>
    <rect x="948" y="528" width="4" height="66"/><rect x="926" y="558" width="48" height="4"/>
    <rect x="868" y="422" width="2" height="32"/><rect x="852" y="437" width="32" height="2"/>
    <path d="M974 526 L994 530 L990 598 L972 596 Z" transform="rotate(8 984 560)"/>
    <rect x="886" y="676" width="4" height="66"/>
  </g>
  <!-- ghost in the upstairs window -->
  <path d="M784 590 C784 550 816 550 816 590 L816 594 L810 588 L804 594 L798 588 L792 594 L786 588 Z" fill="#fff6e8" opacity=".85"/>
  <g fill="#3a1d10"><circle cx="795" cy="570" r="3"/><circle cx="806" cy="570" r="3"/><ellipse cx="800" cy="580" rx="3" ry="4"/></g>

  <!-- ground and fence -->
  <path d="M0 820 C200 800 380 790 500 780 C700 760 900 770 1200 750 L1200 900 L0 900 Z" fill="#0a0412"/>
  <g fill="#0a0412">
    <rect x="560" y="740" width="1000" height="6" transform="rotate(-1 560 740)"/>
    <path d="M572 790 L572 728 L578 716 L584 728 L584 790 Z"/><path d="M606 790 L604 724 L610 712 L616 724 L618 790 Z"/>
    <path d="M640 790 L642 730 L648 718 L654 730 L652 790 Z"/><path d="M1040 790 L1040 724 L1046 712 L1052 724 L1052 790 Z"/>
    <path d="M1074 790 L1076 730 L1082 718 L1088 730 L1086 790 Z"/>
  </g>
  <!-- gravestones -->
  <g fill="#1f1030"><path d="M600 820 L600 790 Q620 768 640 790 L640 820 Z"/><path d="M1060 828 L1060 800 Q1076 782 1092 800 L1092 828 Z"/></g>

  <!-- jack-o'-lanterns -->
  <g transform="translate(948 800)">
    <ellipse cx="0" cy="0" rx="46" ry="36" fill="url(#pump)"/>
    <path d="M-16 -32 Q0 -38 16 -32 M0 -36 L4 -50" stroke="#2e5a1c" stroke-width="6" fill="none"/>
    <g fill="#ffe36b"><path d="M-24 -8 L-12 -20 L-6 -6 Z"/><path d="M24 -8 L12 -20 L6 -6 Z"/><path d="M-26 8 L-16 14 L-8 8 L0 16 L8 8 L16 14 L26 8 L18 22 L-18 22 Z"/></g>
  </g>
  <g transform="translate(1040 812) scale(.75)">
    <ellipse cx="0" cy="0" rx="46" ry="36" fill="url(#pump)"/>
    <path d="M0 -36 L4 -50" stroke="#2e5a1c" stroke-width="6"/>
    <g fill="#ffe36b"><path d="M-22 -6 L-10 -18 L-4 -4 Z"/><path d="M22 -6 L10 -18 L4 -4 Z"/><path d="M-20 10 L20 10 L10 22 L-10 22 Z"/></g>
  </g>

  <!-- fog -->
  <g fill="#e9dcff" opacity=".18" filter="url(#blur)">
    <ellipse cx="760" cy="820" rx="260" ry="40"/><ellipse cx="1050" cy="840" rx="240" ry="36"/><ellipse cx="520" cy="840" rx="220" ry="30"/>
  </g>

  </g>

  <!-- bats -->
  <g fill="#0b0514">
    <use href="#bat" transform="translate(760 150) scale(1.3)"/>
    <use href="#bat" transform="translate(960 120) scale(.8) rotate(-8)"/>
    <use href="#bat" transform="translate(1010 330) scale(.6) rotate(10)"/>
    <use href="#bat" transform="translate(640 280) scale(.55) rotate(6)"/>
  </g>
</svg>
